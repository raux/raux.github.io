# Rebuilds the research deck catalogue, and rotates what it puts forward.
#
#   bib/*.bib   +  bib/deck-overrides.yaml  ->  data/papers.yaml  ->  /papers/
#
# Drop a new BibTeX export into bib/, push, and the deck updates itself.
# On a schedule it also reshuffles the billboard and the Spotlight row — daily,
# unless the billboard is held (`feature.py --pin`), which it honours.
name: Rebuild paper deck

on:
  push:
    branches: [master]
    paths:
      - "bib/**.bib"
      - "bib/deck-overrides.yaml"
      - "bib/people.yaml"
      - "bib/venues.yaml"
      - "scripts/bib2papers.py"
  pull_request:
    branches: [master]
    paths:
      - "bib/**"
      - "data/papers.yaml"
      - "scripts/bib2papers.py"
  # Daily, 09:00 JST. For a weekly billboard use "0 0 * * 1" instead.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      rotate:
        description: "Also reshuffle the billboard and Spotlight row"
        type: boolean
        default: false

permissions:
  contents: write # publish the regenerated catalogue on an automation branch
  pull-requests: write # open a pull request for generated changes

concurrency:
  group: paper-deck
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      # Only the schedule and an explicit dispatch reshuffle. A content push
      # must not move the billboard out from under whatever you just wrote.
      - name: Rotate the billboard
        if: github.event_name == 'schedule' || github.event.inputs.rotate == 'true'
        run: |
          set -o pipefail
          {
            echo '### Paper deck — rotated'
            echo '```'
            python scripts/feature.py --seed "$(date -u +%F)" --count 8 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # On a pull request, only report. Nothing is written or committed.
      - name: Check the catalogue is current
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          {
            echo '### Paper deck — check'
            echo '```'
            python scripts/bib2papers.py --check 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Regenerate the catalogue
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          {
            echo '### Paper deck — regenerated'
            echo '```'
            python scripts/bib2papers.py 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open or update generated-content pull request
        if: github.event_name != 'pull_request'
        run: |
          git add data/papers.yaml data/venues.yaml data/institutions.yaml \
                  bib/deck-overrides.yaml bib/feature-history.yaml
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.rotate }}" = "true" ]; then
            MSG="chore(deck): rotate the billboard [skip ci]"
          else
            MSG="chore(deck): regenerate papers.yaml from BibTeX [skip ci]"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MSG"
          branch="automation/paper-deck"
          git switch --create "$branch"
          git push --force origin "HEAD:refs/heads/$branch"
          if [ "$(gh pr list --base master --head "$branch" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --base master \
              --head "$branch" \
              --title "chore(deck): refresh generated paper catalogue" \
              --body "Automated update of the generated paper catalogue and deck rotation."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
