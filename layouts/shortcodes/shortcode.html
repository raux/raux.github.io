<ul>
  {{ $urlPre := "search?author=raula-k@is.naist.jp" }}
  {{ $url := printf "%s%s" $urlPre "/users/zero734kr/gists" }}
  {{ $remote := resources.GetRemote $url }}
  {{ $gistJ := $remote | transform.Unmarshal }}
  {{ range first 10 $gistJ }}
    {{ if .public }}
      <li><a href="{{ .html_url }}" target="_blank">{{ .description }}</a></li>
    {{ end }}
  {{ end }}
</ul>
