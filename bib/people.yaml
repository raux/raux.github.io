# Who wrote what, and where they are now.
#
# The .bib gives author names and order; it has no field for affiliation, so the
# institution each person belongs to lives here. Cards show the first author
# prominently and a chip for every distinct institution on the paper.
#
# These are CURRENT affiliations, reused across all of a person's papers — so an
# older paper shows where its authors are today, not where the work was done.
#
# A person with no institution simply contributes no chip, and the generator warns
# so the gaps stay visible. Fill them in as you go; nothing here is overwritten.
#
# `self: true` marks the site owner, shown in the accent colour throughout.

# Name variants seen across sources, folded onto one canonical person.
# Key is the variant as it appears in the .bib; value is the name to display.
aliases:
  "Brittany Anne Reid": "Brittany Reid"
  "Jesus M. Gonzalez-Barahona": "Jesús M. González-Barahona"

institutions:
  osaka:       { name: "The University of Osaka", short: "Osaka", color: "#0F3B7C" }
  naist:       { name: "Nara Institute of Science and Technology", short: "NAIST", color: "#1F5FA8" }
  smu:         { name: "Singapore Management University", short: "SMU", color: "#125C4B" }
  shinshu:     { name: "Shinshu University", short: "Shinshu", color: "#5E8C3A" }
  fun:         { name: "Future University Hakodate", short: "FUN Hakodate", color: "#2E7D8F" }
  tianjin:     { name: "Tianjin University", short: "Tianjin", color: "#9B2335" }
  kyushu:      { name: "Kyushu University", short: "Kyushu", color: "#7B3D8E" }
  waterloo:    { name: "University of Waterloo", short: "Waterloo", color: "#9A7B1F" }
  ets:         { name: "École de technologie supérieure", short: "ÉTS Montréal", color: "#C0392B" }
  melbourne:   { name: "University of Melbourne", short: "Melbourne", color: "#123A6D" }
  urjc:        { name: "Universidad Rey Juan Carlos", short: "URJC", color: "#A62B30" }
  mahidol:     { name: "Mahidol University", short: "Mahidol", color: "#23478C" }
  ritsumeikan: { name: "Ritsumeikan University", short: "Ritsumeikan", color: "#8E1C2B" }
  umflint:     { name: "University of Michigan–Flint", short: "UM–Flint", color: "#00274C" }
  heidelberg:  { name: "Heidelberg University", short: "Heidelberg", color: "#8E1F2F" }

