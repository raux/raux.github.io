# Human-owned curation for the research deck.  Nothing here is ever overwritten.
#
# Facts (title, year, venue, url) come from data/*.bib.
# This file adds what BibTeX cannot express: which themes a paper belongs to,
# the one-line logline shown on its card, and which paper takes the billboard.
#
# Keys match either a BibTeX citation key or the paper title — punctuation and
# case are ignored, so neither has to be typed exactly.
#
# Per-entry options:
#   themes:   any of  eco  sec  prof  soc  review     (max 3, first one tints the poster)
#   logline:  one or two sentences, written for a reader outside your field
#   venue:    override the abbreviation derived from the .bib
#   kind:     journal | conf | preprint
#   hide:     true to keep an entry out of the deck
#
# The generator warns about any key here that matched no .bib entry, and about
# any paper still missing a logline — so nothing goes stale silently.

