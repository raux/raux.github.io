# Co-supervised doctoral students, for the ticker on /posts/students/.
#
# HAND-MAINTAINED — the one file in data/ that is not generated. There is no
# fetcher for this; people move, and only you know where they went.
#
#   photo:  a file in static/students/ (e.g. "tao-xiao.jpg"). Leave it empty
#           and the ticker draws a monogram from their initials instead, so a
#           missing photo looks deliberate rather than broken.
#           Square images, 400x400 or larger. Ask each person for one they
#           like rather than lifting their staff photo — see static/students/README.md.
#   url:    where the reader goes on click. Their own homepage where they keep
#           one, otherwise a university or conference profile.
#   now:    current role, short enough to read at a glance. Leave empty when
#           you do not know; the ticker then shows only the year.
#   since:  the year `now` was last true, so a stale line is visible as stale.
#
# Order is the order they appear. Graduated first, by year, then current.

